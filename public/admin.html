<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Dashboard · ConsultHub</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <div class="bg-blobs" aria-hidden="true">
        <span class="blob blob-1"></span>
        <span class="blob blob-2"></span>
        <span class="blob blob-3"></span>
    </div>

    <header class="topbar">
        <a class="brand" href="/">
            <span class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>
            </span>
            <span>Consult<span class="accent">Hub</span></span>
        </a>
        <a class="topbar-link" href="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Booking page
        </a>
    </header>

    <main class="container">
        <!-- Login -->
        <section class="login-wrap" id="loginView">
            <form class="card login-card" id="loginForm">
                <div class="avatar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <h1>Teacher Dashboard</h1>
                <p class="muted small">Enter your admin password to view appointments.</p>
                <label class="field">
                    <span>Password</span>
                    <input type="password" id="passwordInput" autocomplete="current-password" placeholder="••••••••" required />
                </label>
                <div class="form-error hidden" id="loginError"></div>
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    <span class="btn-label">Sign in</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>
        </section>

        <!-- Dashboard -->
        <section class="hidden" id="dashView">
            <div class="dash-head">
                <div>
                    <p class="muted small" id="todayLabel"></p>
                    <h1>Your <span class="gradient-text">appointments</span></h1>
                </div>
                <div class="dash-actions">
                    <button class="btn btn-ghost" id="refreshBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
                        Refresh
                    </button>
                    <button class="btn btn-ghost" id="logoutBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
                        Sign out
                    </button>
                </div>
            </div>

            <div class="stats">
                <div class="card stat">
                    <div class="stat-icon green">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                    </div>
                    <div>
                        <div class="stat-value" id="statToday">0</div>
                        <div class="stat-label">Today</div>
                    </div>
                </div>
                <div class="card stat">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                    </div>
                    <div>
                        <div class="stat-value" id="statWeek">0</div>
                        <div class="stat-label">Next 7 days</div>
                    </div>
                </div>
                <div class="card stat">
                    <div class="stat-icon pink">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </div>
                    <div>
                        <div class="stat-value" id="statUpcoming">0</div>
                        <div class="stat-label">All upcoming</div>
                    </div>
                </div>
            </div>

            <div class="card bookings-card">
                <div class="toolbar">
                    <div class="tabs" role="tablist">
                        <button class="tab active" data-tab="upcoming">Upcoming <span class="count" id="countUpcoming">0</span></button>
                        <button class="tab" data-tab="past">Past <span class="count" id="countPast">0</span></button>
                    </div>
                    <label class="search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                        <input type="search" id="searchInput" placeholder="Search name or reason…" />
                    </label>
                </div>
                <div class="bookings" id="bookingList"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>© <span id="year"></span> ConsultHub · Teacher dashboard</p>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/admin.js"></script>
</body>
</html>
