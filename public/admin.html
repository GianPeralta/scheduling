<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dashboard</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/admin.html">
            <span class="brand-mark">AG</span>
            <span class="brand-text">
                <strong>Instructor Dashboard</strong>
                <small>Arnemie Gayyed</small>
            </span>
        </a>
        <div class="topbar-actions">
            <a class="topbar-link" href="/">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                <span>Booking page</span>
            </a>
        </div>
    </header>

    <main class="container">
        <!-- Login -->
        <section class="login-wrap" id="loginView">
            <form class="card login-card" id="loginForm">
                <div class="avatar">AG</div>
                <h1>Dashboard</h1>
                <label class="field">
                    <span>Password</span>
                    <input type="password" id="passwordInput" autocomplete="current-password" placeholder="••••••••" required />
                </label>
                <div class="form-error hidden" id="loginError"></div>
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    <span class="btn-label">Sign in</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>
        </section>

        <!-- Dashboard -->
        <section class="hidden" id="dashView">
            <div class="dash-head">
                <div>
                    <p class="muted small" id="todayLabel"></p>
                    <h1>Consultations</h1>
                </div>
                <div class="dash-actions">
                    <button type="button" class="btn btn-primary" id="openBlockModalBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m5.7 5.7 12.6 12.6"/></svg>
                        Block Date / Time
                    </button>
                    <button class="btn btn-ghost" id="refreshBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
                        Refresh
                    </button>
                    <button class="btn btn-ghost" id="logoutBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
                        Sign out
                    </button>
                </div>
            </div>

            <div class="stats">
                <div class="card stat">
                    <div class="stat-icon teal">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                    </div>
                    <div>
                        <div class="stat-value" id="statToday">0</div>
                        <div class="stat-label">Today</div>
                    </div>
                </div>
                <div class="card stat">
                    <div class="stat-icon sky">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                    </div>
                    <div>
                        <div class="stat-value" id="statWeek">0</div>
                        <div class="stat-label">Next 7 days</div>
                    </div>
                </div>
                <div class="card stat">
                    <div class="stat-icon amber">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </div>
                    <div>
                        <div class="stat-value" id="statUpcoming">0</div>
                        <div class="stat-label">Upcoming</div>
                    </div>
                </div>
            </div>

            <div class="card bookings-card">
                <div class="toolbar">
                    <div class="tabs" role="tablist">
                        <button class="tab active" data-tab="upcoming">Upcoming <span class="count" id="countUpcoming">0</span></button>
                        <button class="tab" data-tab="past">Past <span class="count" id="countPast">0</span></button>
                        <button class="tab" data-tab="cancelled">Cancelled <span class="count" id="countCancelled">0</span></button>
                        <button class="tab" data-tab="blocked">Blocked <span class="count" id="countBlocked">0</span></button>
                    </div>
                    <label class="search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                        <input type="search" id="searchInput" placeholder="Search…" />
                    </label>
                </div>
                <div class="bookings" id="bookingList"></div>
            </div>
        </section>
    </main>

    <!-- Block Date / Time Modal -->
    <div class="modal-backdrop hidden" id="blockModal" role="dialog" aria-modal="true" aria-labelledby="blockModalTitle">
        <div class="modal-card">
            <div class="modal-head">
                <h3 id="blockModalTitle">Block Date or Time</h3>
                <button type="button" class="icon-btn" id="closeBlockModalBtn" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <form class="modal-body" id="blockScheduleForm" novalidate>
                <div class="segmented" role="radiogroup" aria-label="Block scope">
                    <label>
                        <input type="radio" name="blockScope" value="full" checked />
                        <span>Entire day</span>
                    </label>
                    <label>
                        <input type="radio" name="blockScope" value="time" />
                        <span>Specific time</span>
                    </label>
                </div>

                <label class="field">
                    <span>Date</span>
                    <input type="date" id="blockDateInput" required />
                </label>

                <div class="block-time-grid hidden" id="blockTimeFields">
                    <label class="field">
                        <span>Start time</span>
                        <input type="time" id="blockStartTimeInput" value="08:00" step="300" />
                    </label>
                    <label class="field">
                        <span>End time</span>
                        <input type="time" id="blockEndTimeInput" value="17:00" step="300" />
                    </label>
                </div>

                <label class="field">
                    <span>Reason <small class="muted">(optional, shown to students)</small></span>
                    <input type="text" id="blockReasonInput" maxlength="500" placeholder="e.g. Out sick, faculty meeting" />
                </label>

                <label class="block-cancel-check">
                    <input type="checkbox" id="blockCancelExistingInput" checked />
                    <span>Cancel existing appointments during this time</span>
                </label>

                <div class="form-error hidden" id="blockFormError" role="alert"></div>

                <div class="modal-actions modal-actions-row">
                    <button type="button" class="btn btn-ghost" id="cancelBlockModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-danger" id="confirmBlockBtn">
                        <span class="btn-label">Block</span>
                        <span class="spinner hidden"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Cancel Appointment Modal (with required reason visible in student's profile) -->
    <div class="modal-backdrop hidden" id="cancelModal" role="dialog" aria-modal="true" aria-labelledby="cancelModalTitle">
        <div class="modal-card modal-wide">
            <div class="modal-head">
                <h3 id="cancelModalTitle">Cancel Consultation</h3>
                <button type="button" class="icon-btn" id="closeCancelModalBtn" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <form class="modal-body" id="cancelBookingForm" novalidate>
                <div class="cancel-target-summary" id="cancelTargetSummary"></div>

                <label class="field" id="cancelReasonField">
                    <span>Reason for cancellation</span>
                    <textarea id="cancelReasonInput" rows="3" maxlength="500" placeholder="Enter reason for cancellation…"></textarea>
                    <small class="counter"><span id="cancelReasonCount">0</span>/500</small>
                    <small class="field-error hidden" id="cancelReasonError" role="alert"></small>
                </label>

                <div class="modal-actions modal-actions-row">
                    <button type="button" class="btn btn-ghost" id="keepAppointmentBtn">Keep</button>
                    <button type="submit" class="btn btn-danger" id="confirmCancelBtn">
                        <span class="btn-label">Cancel consultation</span>
                        <span class="spinner hidden"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>© <span id="year"></span>Consultation dashboard</p>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/admin.js"></script>
</body>
</html>
